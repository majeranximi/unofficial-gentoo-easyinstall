---
modules-search: [ local ]
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - dracutlukscfg
  - openrcdmcryptcfg
  - users
  - displaymanager
  - hwclock
  - shellprocess
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: gentoo_branding
prompt-install: true
dont-chroot: false
