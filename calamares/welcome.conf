---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    15.0  # the unpacked system is ~11 GB
    requiredRam:        2.0  # only copies a prebuilt system, nothing is compiled
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root
