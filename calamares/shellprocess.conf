---
# Strips everything that only belongs to the live session from the installed system.
# Must run AFTER the users module: it writes /etc/hostname, but OpenRC reads /etc/conf.d/hostname.
dontChroot: false
timeout: 120
script:
    - "-userdel -r gentoo"
    - "rm -f /etc/sudoers.d/00-live /etc/sddm.conf.d/00-live-autologin.conf /etc/calamares/settings.conf"
    - "sh -c 'echo hostname=$(cat /etc/hostname) > /etc/conf.d/hostname'"
    # language + keyboard: move Calamares' systemd-style files to where OpenRC and Plasma read them
    - "/usr/lib/easyinstall/openrc-postinstall.sh"
    # marker for the ISO's GRUB: if present on a disk, the ISO boots the installed system by default
    - "touch /boot/gentoo-installed"
    # restore Plasma Welcome, hidden in the live session
    - "-mv /usr/lib64/kded_plasma_welcome.so.live-off /usr/lib64/qt6/plugins/kf6/kded/kded_plasma_welcome.so"
